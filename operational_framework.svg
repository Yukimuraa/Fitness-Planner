<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-angle">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-angle">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-angle">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0d9488" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-angle">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6366f1" />
    </marker>

    <!-- Filters for drop shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-md" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="adminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="coachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="pcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Title Section -->
  <text x="550" y="42" font-size="24" font-weight="800" text-anchor="middle" fill="#0f172a" letter-spacing="-0.02em">
    OPERATIONAL FRAMEWORK
  </text>
  <text x="550" y="66" font-size="14" font-weight="600" text-anchor="middle" fill="#64748b" letter-spacing="0.05em">
    FitLife: Personalized Nutrition, Workout Planning &amp; Progress Analytics System
  </text>

  <!-- ======================================================== -->
  <!-- CONNECTING ARROWS & FLOW LABELS                           -->
  <!-- ======================================================== -->

  <!-- 1. CLOUD <-> CUSTOMER/USER (TOP-LEFT) -->
  <path d="M 440 180 Q 280 200 190 280" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-blue)" />
  <g transform="translate(190, 195)">
    <rect x="0" y="0" width="220" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="110" y="17" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Personalized Meal Plans &amp; Macros</text>
    <text x="110" y="32" font-size="10" font-weight="500" fill="#3b82f6" text-anchor="middle">Target Calories, Water &amp; BMI Status</text>
  </g>

  <!-- 2. USER -> COMPUTER (SYSTEM) -->
  <path d="M 210 375 L 435 440" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <g transform="translate(230, 420)">
    <rect x="0" y="0" width="180" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="90" y="17" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Biometric &amp; Health Profile</text>
    <text x="90" y="32" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">(Height, Weight, Age, Goals, Focus)</text>
  </g>

  <!-- 3. COMPUTER (SYSTEM) -> CLOUD -->
  <path d="M 525 390 L 525 245" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <g transform="translate(365, 290)">
    <rect x="0" y="0" width="150" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="75" y="17" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Store User Biometrics,</text>
    <text x="75" y="32" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Logs &amp; Schedules</text>
  </g>

  <!-- 4. CLOUD -> COMPUTER (SYSTEM) -->
  <path d="M 575 245 L 575 390" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <g transform="translate(585, 290)">
    <rect x="0" y="0" width="160" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="80" y="17" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Retrieve Nutrition DB,</text>
    <text x="80" y="32" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Workouts &amp; History</text>
  </g>

  <!-- 5. CLOUD -> ADMIN / MANAGER (TOP-RIGHT) -->
  <path d="M 660 180 Q 820 200 900 280" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-blue)" />
  <g transform="translate(690, 195)">
    <rect x="0" y="0" width="225" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="112" y="17" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">BMI Distribution &amp; Goal Trends</text>
    <text x="112" y="32" font-size="10" font-weight="500" fill="#3b82f6" text-anchor="middle">User Demographic &amp; Analytics Reports</text>
  </g>

  <!-- 6. ADMIN / MANAGER -> COMPUTER (SYSTEM) -->
  <path d="M 880 375 L 665 440" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <g transform="translate(685, 420)">
    <rect x="0" y="0" width="195" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="97" y="17" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Report Request &amp; Monitoring</text>
    <text x="97" y="32" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Meal &amp; Workout Catalog Management</text>
  </g>

  <!-- 7. COMPUTER (SYSTEM) -> COACH/TRACKER (BOTTOM-CENTER) -->
  <path d="M 525 565 L 525 650" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)" />
  <g transform="translate(370, 585)">
    <rect x="0" y="0" width="145" height="42" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1" />
    <text x="72" y="17" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">Assigned Workouts &amp;</text>
    <text x="72" y="32" font-size="10" font-weight="500" fill="#14b8a6" text-anchor="middle">Weekly Schedule Plan</text>
  </g>

  <!-- 8. COACH/TRACKER -> COMPUTER (SYSTEM) -->
  <path d="M 575 650 L 575 565" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)" />
  <g transform="translate(585, 585)">
    <rect x="0" y="0" width="155" height="42" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1" />
    <text x="77" y="17" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">Execution Status &amp;</text>
    <text x="77" y="32" font-size="10" font-weight="500" fill="#14b8a6" text-anchor="middle">Completion Toggle Update</text>
  </g>

  <!-- 9. COACH/TRACKER -> USER (BOTTOM-LEFT TO MID-LEFT) -->
  <path d="M 450 710 L 190 410" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-indigo)" />
  <g transform="translate(200, 560)">
    <rect x="0" y="0" width="165" height="42" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1" />
    <text x="82" y="17" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">Workout Completion,</text>
    <text x="82" y="32" font-size="10" font-weight="500" fill="#6366f1" text-anchor="middle">Form Guidance &amp; Feedback</text>
  </g>

  <!-- ======================================================== -->
  <!-- NODE ENTITIES                                            -->
  <!-- ======================================================== -->

  <!-- NODE 1: TOP - CLOUD & DATABASE -->
  <g transform="translate(470, 95)" filter="url(#shadow-md)">
    <!-- Cloud shape -->
    <path d="M 40 75 A 35 35 0 0 1 70 25 A 45 45 0 0 1 145 20 A 40 40 0 0 1 185 60 A 30 30 0 0 1 180 85 A 30 30 0 0 1 150 95 L 45 95 A 30 30 0 0 1 40 75 Z"
          fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="2" />
    <!-- Cylinder Database inside cloud -->
    <g transform="translate(68, 30)">
      <ellipse cx="28" cy="10" rx="22" ry="7" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
      <path d="M 6 10 v 14 a 22 7 0 0 0 44 0 v -14" fill="url(#dbGrad)" stroke="#0284c7" stroke-width="1.5" />
      <ellipse cx="28" cy="24" rx="22" ry="7" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
      <path d="M 6 24 v 14 a 22 7 0 0 0 44 0 v -14" fill="url(#dbGrad)" stroke="#0284c7" stroke-width="1.5" />
      <ellipse cx="28" cy="38" rx="22" ry="7" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
      <path d="M 6 38 v 14 a 22 7 0 0 0 44 0 v -14" fill="url(#dbGrad)" stroke="#0284c7" stroke-width="1.5" />
    </g>
    <text x="110" y="115" font-size="15" font-weight="800" fill="#0284c7" text-anchor="middle">Cloud Database &amp;</text>
    <text x="110" y="132" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Analytics Engine</text>
    <text x="110" y="147" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">(Database / Cloud Storage / BMR Analytics)</text>
  </g>

  <!-- NODE 2: LEFT - USER / CLIENT -->
  <g transform="translate(60, 260)" filter="url(#shadow)">
    <circle cx="90" cy="70" r="50" fill="#f0f9ff" stroke="#e0f2fe" stroke-width="2" />
    <circle cx="115" cy="55" r="16" fill="#0284c7" opacity="0.8" />
    <path d="M 98 88 A 24 20 0 0 1 136 85" fill="#0284c7" opacity="0.8" />
    <circle cx="80" cy="50" r="22" fill="url(#userGrad)" />
    <path d="M 50 96 C 50 78 62 72 80 72 C 98 72 110 78 110 96 Z" fill="url(#userGrad)" />

    <text x="90" y="145" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">User / Member</text>
    <text x="90" y="165" font-size="13" font-weight="700" fill="#0284c7" text-anchor="middle">(Fitness Client)</text>
    <text x="90" y="185" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Biometric Input, Weight Logs,</text>
    <text x="90" y="200" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Schedule Tracking &amp; Meals</text>
  </g>

  <!-- NODE 3: CENTER - COMPUTER (SYSTEM) -->
  <g transform="translate(445, 395)" filter="url(#shadow-md)">
    <rect x="0" y="0" width="210" height="150" rx="12" fill="url(#pcGrad)" stroke="#cbd5e1" stroke-width="2" />
    <rect x="10" y="10" width="190" height="105" rx="6" fill="#0f172a" />
    <rect x="18" y="18" width="50" height="35" rx="3" fill="#1e293b" />
    <path d="M 23 45 L 35 32 L 47 40 L 60 25" fill="none" stroke="#38bdf8" stroke-width="2" />
    <rect x="75" y="18" width="115" height="8" rx="2" fill="#334155" />
    <rect x="75" y="32" width="90" height="6" rx="2" fill="#475569" />
    <rect x="75" y="44" width="105" height="6" rx="2" fill="#334155" />
    <rect x="18" y="60" width="55" height="45" rx="3" fill="#1e293b" />
    <text x="45" y="86" font-size="18" fill="#10b981" text-anchor="middle">🥗</text>
    <rect x="78" y="60" width="55" height="45" rx="3" fill="#1e293b" />
    <text x="105" y="86" font-size="18" fill="#f59e0b" text-anchor="middle">🏋️</text>
    <rect x="138" y="60" width="52" height="45" rx="3" fill="#1e293b" />
    <text x="164" y="86" font-size="18" fill="#6366f1" text-anchor="middle">📊</text>

    <path d="M 90 120 L 80 142 L 130 142 L 120 120 Z" fill="#94a3b8" />
    <rect x="65" y="142" width="80" height="6" rx="3" fill="#64748b" />

    <text x="105" y="172" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">Computer (System)</text>
    <text x="105" y="190" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">FitLife Core Platform</text>
    <text x="105" y="206" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">BMR Engine, Meal Generator &amp; Scheduler</text>
  </g>

  <!-- NODE 4: RIGHT - ADMIN / MANAGER -->
  <g transform="translate(850, 260)" filter="url(#shadow)">
    <circle cx="85" cy="70" r="50" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="65" cy="50" r="20" fill="url(#adminGrad)" />
    <path d="M 38 96 C 38 78 50 72 65 72 C 77 72 87 76 91 85" fill="url(#adminGrad)" />
    <g transform="translate(80, 42)">
      <rect x="0" y="0" width="45" height="34" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
      <rect x="18" y="5" width="8" height="5" rx="1" fill="#38bdf8" />
      <line x1="22" y1="10" x2="22" y2="17" stroke="#94a3b8" stroke-width="1.2" />
      <line x1="10" y1="17" x2="34" y2="17" stroke="#94a3b8" stroke-width="1.2" />
      <rect x="6" y="19" width="8" height="5" rx="1" fill="#10b981" />
      <rect x="18" y="19" width="8" height="5" rx="1" fill="#f59e0b" />
      <rect x="30" y="19" width="8" height="5" rx="1" fill="#ec4899" />
    </g>

    <text x="85" y="145" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">Fitness Manager</text>
    <text x="85" y="165" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">(System Administrator)</text>
    <text x="85" y="185" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Staff Monitoring Dashboard,</text>
    <text x="85" y="200" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">User Demographics &amp; Meal Catalog</text>
  </g>

  <!-- NODE 5: BOTTOM - TRAINER / COACH / EXECUTION -->
  <g transform="translate(465, 645)" filter="url(#shadow)">
    <circle cx="85" cy="55" r="45" fill="#f0fdf4" stroke="#dcfce7" stroke-width="2" />
    <circle cx="85" cy="38" r="18" fill="url(#coachGrad)" />
    <path d="M 75 25 Q 95 20 105 28" stroke="#042f2e" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 60 78 C 60 62 70 56 85 56 C 100 56 110 62 110 78 Z" fill="url(#coachGrad)" />
    <circle cx="85" cy="65" r="4" fill="#facc15" stroke="#ca8a04" stroke-width="1" />

    <text x="85" y="118" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">Fitness Coach / Trainer</text>
    <text x="85" y="135" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">(Workout Execution &amp; Tracker)</text>
    <text x="85" y="150" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">Daily Routine Assignment, Completion Logging,</text>
    <text x="85" y="164" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">&amp; Physical Exercise Guidance</text>
  </g>

</svg>
