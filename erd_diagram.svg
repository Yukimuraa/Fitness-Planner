<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Header Gradients -->
    <linearGradient id="header-user" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="header-profile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="header-progress" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="header-pref" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="header-schedule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="header-workout" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="header-meal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="header-mealitem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Markers for Crow's Foot ERD notations -->
    <!-- Crow's foot (Many) -->
    <marker id="crows-foot" viewBox="0 0 20 20" refX="15" refY="10" markerWidth="12" markerHeight="12" orient="auto-angle">
      <path d="M 0 3 L 15 10 L 0 17 M 15 0 L 15 20" fill="none" stroke="#64748b" stroke-width="2" />
    </marker>
    <!-- One and only one (||) -->
    <marker id="one-and-only-one" viewBox="0 0 20 20" refX="5" refY="10" markerWidth="12" markerHeight="12" orient="auto-angle">
      <path d="M 5 0 L 5 20 M 12 0 L 12 20" fill="none" stroke="#64748b" stroke-width="2" />
    </marker>
  </defs>

  <!-- Title & Legend -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">ENTITY RELATIONSHIP DIAGRAM (ERD)</text>
    <text x="0" y="24" font-size="14" font-weight="600" fill="#64748b">FitLife — Diet &amp; Fitness Planner Database Schema</text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(870, 25)">
    <rect x="0" y="0" width="270" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#card-shadow)" />
    <circle cx="20" cy="20" r="5" fill="#2563eb" />
    <text x="32" y="24" font-size="11" font-weight="700" fill="#334155">PK: Primary Key</text>
    <circle cx="140" cy="20" r="5" fill="#f59e0b" />
    <text x="152" y="24" font-size="11" font-weight="700" fill="#334155">FK: Foreign Key</text>
    <text x="20" y="44" font-size="11" font-weight="600" fill="#64748b">Notation: Crow's Foot (1:1, 1:N)</text>
  </g>

  <!-- ========================================================= -->
  <!-- RELATIONSHIP CONNECTORS                                   -->
  <!-- ========================================================= -->

  <!-- User (Center) to UserProfile (Left) : 1 to 1 -->
  <path d="M 450 250 L 330 250" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one-and-only-one)" marker-end="url(#one-and-only-one)" />
  <rect x="360" y="235" width="50" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="385" y="249" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">1 : 1</text>

  <!-- User (Center) to UserPreference (Top Right) : 1 to 1 -->
  <path d="M 680 180 L 800 180" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one-and-only-one)" marker-end="url(#one-and-only-one)" />
  <rect x="715" y="165" width="50" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="740" y="179" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">1 : 1</text>

  <!-- User (Center) to ProgressEntry (Bottom Left) : 1 to Many -->
  <path d="M 500 405 L 500 520 L 330 520" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one-and-only-one)" marker-end="url(#crows-foot)" />
  <rect x="380" y="505" width="50" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="405" y="519" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">1 : N</text>

  <!-- User (Center) to WorkoutSchedule (Bottom Center) : 1 to Many -->
  <path d="M 590 405 L 590 540" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one-and-only-one)" marker-end="url(#crows-foot)" />
  <rect x="565" y="465" width="50" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="590" y="479" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">1 : N</text>

  <!-- Workout (Bottom Right) to WorkoutSchedule (Bottom Center) : 1 to Many -->
  <path d="M 800 630 L 710 630" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one-and-only-one)" marker-end="url(#crows-foot)" />
  <rect x="735" y="615" width="50" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="760" y="629" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">1 : N</text>

  <!-- Meal (Far Right Top) to MealItem (Far Right Bottom) : 1 to Many -->
  <path d="M 915 350 L 915 420" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one-and-only-one)" marker-end="url(#crows-foot)" />
  <rect x="890" y="370" width="50" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="915" y="384" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">1 : N</text>


  <!-- ========================================================= -->
  <!-- ENTITY CARDS                                              -->
  <!-- ========================================================= -->

  <!-- ENTITY 1: USER (django.contrib.auth.models.User) -->
  <g transform="translate(450, 120)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="230" height="285" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 222 0 Q 230 0 230 8 L 230 38 L 0 38 Z" fill="url(#header-user)" />
    <text x="115" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">User (auth_user)</text>
    <!-- Field Rows -->
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="145" y="0" fill="#64748b">AutoField</text>

      <text x="32" y="24" font-weight="600" fill="#0f172a">username</text>
      <text x="145" y="24" fill="#64748b">CharField(150)</text>

      <text x="32" y="48" font-weight="600" fill="#0f172a">email</text>
      <text x="145" y="48" fill="#64748b">EmailField</text>

      <text x="32" y="72" font-weight="600" fill="#0f172a">password</text>
      <text x="145" y="72" fill="#64748b">CharField(128)</text>

      <text x="32" y="96" font-weight="600" fill="#0f172a">first_name</text>
      <text x="145" y="96" fill="#64748b">CharField(150)</text>

      <text x="32" y="120" font-weight="600" fill="#0f172a">last_name</text>
      <text x="145" y="120" fill="#64748b">CharField(150)</text>

      <text x="32" y="144" font-weight="600" fill="#0f172a">is_staff</text>
      <text x="145" y="144" fill="#64748b">BooleanField</text>

      <text x="32" y="168" font-weight="600" fill="#0f172a">is_active</text>
      <text x="145" y="168" fill="#64748b">BooleanField</text>

      <text x="32" y="192" font-weight="600" fill="#0f172a">date_joined</text>
      <text x="145" y="192" fill="#64748b">DateTimeField</text>
    </g>
  </g>


  <!-- ENTITY 2: UserProfile -->
  <g transform="translate(60, 110)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="270" height="340" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#header-profile)" />
    <text x="135" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">UserProfile (accounts)</text>
    <!-- Field Rows -->
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="175" y="0" fill="#64748b">AutoField</text>

      <text x="0" y="24" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="24" font-weight="700" fill="#0f172a">user_id [1:1]</text>
      <text x="175" y="24" fill="#64748b">OneToOneField</text>

      <text x="32" y="48" font-weight="600" fill="#0f172a">age</text>
      <text x="175" y="48" fill="#64748b">PositiveInteger</text>

      <text x="32" y="72" font-weight="600" fill="#0f172a">gender</text>
      <text x="175" y="72" fill="#64748b">CharField(20)</text>

      <text x="32" y="96" font-weight="600" fill="#0f172a">height_cm</text>
      <text x="175" y="96" fill="#64748b">PositiveInteger</text>

      <text x="32" y="120" font-weight="600" fill="#0f172a">weight_kg</text>
      <text x="175" y="120" fill="#64748b">FloatField</text>

      <text x="32" y="144" font-weight="600" fill="#0f172a">fitness_goal</text>
      <text x="175" y="144" fill="#64748b">CharField(30)</text>

      <text x="32" y="168" font-weight="600" fill="#0f172a">activity_level</text>
      <text x="175" y="168" fill="#64748b">CharField(20)</text>

      <text x="32" y="192" font-weight="600" fill="#0f172a">focused_muscles</text>
      <text x="175" y="192" fill="#64748b">TextField</text>

      <text x="32" y="216" font-weight="600" fill="#0f172a">birth_date</text>
      <text x="175" y="216" fill="#64748b">DateField</text>

      <text x="32" y="240" font-weight="600" fill="#0f172a">bio</text>
      <text x="175" y="240" fill="#64748b">TextField</text>
    </g>
    <!-- Method badge -->
    <rect x="14" y="306" width="242" height="22" rx="4" fill="#f0f9ff" stroke="#bae6fd" />
    <text x="135" y="321" font-size="10" font-weight="600" fill="#0284c7" text-anchor="middle">Calculates: BMI, TDEE, Calories, Hydration</text>
  </g>


  <!-- ENTITY 3: ProgressEntry -->
  <g transform="translate(60, 480)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="270" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#header-progress)" />
    <text x="135" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">ProgressEntry (accounts)</text>
    <!-- Field Rows -->
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="175" y="0" fill="#64748b">AutoField</text>

      <text x="0" y="24" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="24" font-weight="700" fill="#0f172a">user_id [1:N]</text>
      <text x="175" y="24" fill="#64748b">ForeignKey(User)</text>

      <text x="32" y="48" font-weight="600" fill="#0f172a">recorded_at</text>
      <text x="175" y="48" fill="#64748b">DateField</text>

      <text x="32" y="72" font-weight="600" fill="#0f172a">weight_kg</text>
      <text x="175" y="72" fill="#64748b">FloatField</text>

      <text x="32" y="96" font-weight="600" fill="#0f172a">notes</text>
      <text x="175" y="96" fill="#64748b">CharField(255)</text>

      <text x="32" y="120" font-weight="600" fill="#0f172a">created_at</text>
      <text x="175" y="120" fill="#64748b">DateTimeField</text>
    </g>
  </g>


  <!-- ENTITY 4: UserPreference -->
  <g transform="translate(800, 110)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="280" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 38 L 0 38 Z" fill="url(#header-pref)" />
    <text x="140" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">UserPreference (planner)</text>
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="180" y="0" fill="#64748b">AutoField</text>

      <text x="0" y="24" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="24" font-weight="700" fill="#0f172a">user_id [1:1]</text>
      <text x="180" y="24" fill="#64748b">OneToOneField</text>

      <text x="32" y="48" font-weight="600" fill="#0f172a">daily_calorie_goal</text>
      <text x="180" y="48" fill="#64748b">PositiveInteger</text>

      <text x="32" y="72" font-weight="600" fill="#0f172a">preferred_workout_time</text>
      <text x="180" y="72" fill="#64748b">CharField(50)</text>
    </g>
  </g>


  <!-- ENTITY 5: WorkoutSchedule -->
  <g transform="translate(460, 540)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="250" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 242 0 Q 250 0 250 8 L 250 38 L 0 38 Z" fill="url(#header-schedule)" />
    <text x="125" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">WorkoutSchedule (planner)</text>
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="160" y="0" fill="#64748b">AutoField</text>

      <text x="0" y="24" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="24" font-weight="700" fill="#0f172a">user_id [1:N]</text>
      <text x="160" y="24" fill="#64748b">ForeignKey</text>

      <text x="0" y="48" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="48" font-weight="700" fill="#0f172a">workout_id [1:N]</text>
      <text x="160" y="48" fill="#64748b">ForeignKey</text>

      <text x="32" y="72" font-weight="600" fill="#0f172a">date</text>
      <text x="160" y="72" fill="#64748b">DateField</text>

      <text x="32" y="96" font-weight="600" fill="#0f172a">completed</text>
      <text x="160" y="96" fill="#64748b">BooleanField</text>
    </g>
  </g>


  <!-- ENTITY 6: Workout -->
  <g transform="translate(800, 540)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="280" height="175" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 38 L 0 38 Z" fill="url(#header-workout)" />
    <text x="140" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Workout (planner)</text>
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="180" y="0" fill="#64748b">AutoField</text>

      <text x="32" y="24" font-weight="600" fill="#0f172a">name</text>
      <text x="180" y="24" fill="#64748b">CharField(200)</text>

      <text x="32" y="48" font-weight="600" fill="#0f172a">description</text>
      <text x="180" y="48" fill="#64748b">TextField</text>

      <text x="32" y="72" font-weight="600" fill="#0f172a">duration_min</text>
      <text x="180" y="72" fill="#64748b">PositiveInteger</text>
    </g>
  </g>


  <!-- ENTITY 7: Meal -->
  <g transform="translate(790, 310)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="290" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 282 0 Q 290 0 290 8 L 290 38 L 0 38 Z" fill="url(#header-meal)" />
    <text x="145" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Meal (planner)</text>
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="185" y="0" fill="#64748b">AutoField</text>

      <text x="32" y="24" font-weight="600" fill="#0f172a">name</text>
      <text x="185" y="24" fill="#64748b">CharField(200)</text>

      <text x="32" y="48" font-weight="600" fill="#0f172a">description</text>
      <text x="185" y="48" fill="#64748b">TextField</text>
    </g>
  </g>


  <!-- ENTITY 8: MealItem -->
  <g transform="translate(60, 720)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="310" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 302 0 Q 310 0 310 8 L 310 38 L 0 38 Z" fill="url(#header-mealitem)" />
    <text x="155" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">MealItem (planner)</text>
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="200" y="0" fill="#64748b">AutoField</text>

      <text x="0" y="24" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="24" font-weight="700" fill="#0f172a">meal_id [1:N]</text>
      <text x="200" y="24" fill="#64748b">ForeignKey(Meal)</text>

      <text x="32" y="48" font-weight="600" fill="#0f172a">name</text>
      <text x="200" y="48" fill="#64748b">CharField(200)</text>

      <text x="32" y="72" font-weight="600" fill="#0f172a">calories</text>
      <text x="200" y="72" fill="#64748b">PositiveInteger</text>

      <text x="32" y="96" font-weight="600" fill="#0f172a">protein_g</text>
      <text x="200" y="96" fill="#64748b">FloatField</text>

      <text x="32" y="120" font-weight="600" fill="#0f172a">carbs_g / fat_g</text>
      <text x="200" y="120" fill="#64748b">FloatField / FloatField</text>
    </g>
  </g>

  <!-- Meal to MealItem connector in bottom layout -->
  <path d="M 790 385 C 500 385 410 740 370 760" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#one-and-only-one)" marker-end="url(#crows-foot)" />
  <rect x="490" y="500" width="75" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="527" y="514" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Meal : Items</text>

</svg>
