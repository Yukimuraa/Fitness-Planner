<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitLife — Entity Relationship Diagram (ERD)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 0.4rem;
    }
    .header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .toolbar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 0.65rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #334155;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .diagram-container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      max-width: 1250px;
      width: 100%;
      overflow: auto;
      border: 1px solid #334155;
      padding: 1.5rem;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>FitLife Database Schema — Entity Relationship Diagram</h1>
    <p>Complete relational schema including accounts, profiles, meal planning, workouts, and schedules.</p>
  </div>

  <div class="toolbar">
    <button class="btn" id="downloadBtn">📥 Download as High-Res PNG Image</button>
    <a href="erd_diagram.svg" download="fitlife_erd_diagram.svg" class="btn btn-secondary">📄 Download SVG Vector</a>
  </div>

  <div class="diagram-container" id="svgContainer">
    <object id="svgObject" data="erd_diagram.svg" type="image/svg+xml" style="width: 100%; min-height: 850px;"></object>
  </div>

  <canvas id="exportCanvas" style="display: none;"></canvas>

  <script>
    document.getElementById('downloadBtn').addEventListener('click', async () => {
      try {
        const response = await fetch('erd_diagram.svg');
        const svgText = await response.text();
        const parser = new DOMParser();
        const svgDoc = parser.parseFromString(svgText, 'image/svg+xml');
        const svgEl = svgDoc.documentElement;

        const width = 1200 * 2;
        const height = 950 * 2;

        const canvas = document.getElementById('exportCanvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');

        const img = new Image();
        const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(svgBlob);

        img.onload = () => {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(blobURL);

          const pngURI = canvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.download = 'fitlife_erd_diagram.png';
          a.href = pngURI;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };
        img.src = blobURL;
      } catch (err) {
        alert('Could not export canvas image: ' + err.message);
      }
    });
  </script>
</body>
</html>
