<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 950" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="hdr-admin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hdr-log" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="hdr-perm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="hdr-group" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="hdr-content" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="hdr-managed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Crow's Foot markers -->
    <marker id="crow" viewBox="0 0 20 20" refX="15" refY="10" markerWidth="12" markerHeight="12" orient="auto-angle">
      <path d="M 0 3 L 15 10 L 0 17 M 15 0 L 15 20" fill="none" stroke="#64748b" stroke-width="2" />
    </marker>
    <marker id="one" viewBox="0 0 20 20" refX="5" refY="10" markerWidth="12" markerHeight="12" orient="auto-angle">
      <path d="M 5 0 L 5 20 M 12 0 L 12 20" fill="none" stroke="#64748b" stroke-width="2" />
    </marker>
  </defs>

  <!-- Title & Legend Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-size="26" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">ADMIN &amp; RBAC ENTITY RELATIONSHIP DIAGRAM</text>
    <text x="0" y="24" font-size="14" font-weight="600" fill="#64748b">FitLife Administration, Role-Based Access Control (RBAC), Audit Logging &amp; Managed Resources</text>
  </g>

  <!-- Legend -->
  <g transform="translate(930, 25)">
    <rect x="0" y="0" width="360" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)" />
    <circle cx="20" cy="20" r="5" fill="#2563eb" />
    <text x="32" y="24" font-size="11" font-weight="700" fill="#334155">PK: Primary Key</text>
    <circle cx="140" cy="20" r="5" fill="#f59e0b" />
    <text x="152" y="24" font-size="11" font-weight="700" fill="#334155">FK: Foreign Key</text>
    <circle cx="250" cy="20" r="5" fill="#7c3aed" />
    <text x="262" y="24" font-size="11" font-weight="700" fill="#334155">RBAC &amp; Audit</text>
    <text x="20" y="46" font-size="11" font-weight="600" fill="#64748b">Staff Authorization, Permissions, Action Logs, and Managed Catalogs</text>
  </g>


  <!-- ========================================================= -->
  <!-- CONNECTING RELATIONSHIPS                                  -->
  <!-- ========================================================= -->

  <!-- Admin User to django_admin_log: 1 to Many -->
  <path d="M 330 240 L 460 240" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)" />
  <rect x="375" y="228" width="45" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="397" y="241" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">1 : N</text>

  <!-- ContentType to django_admin_log: 1 to Many -->
  <path d="M 740 240 L 870 240" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#crow)" marker-end="url(#one)" />
  <rect x="785" y="228" width="45" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="807" y="241" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">N : 1</text>

  <!-- ContentType to auth_permission: 1 to Many -->
  <path d="M 990 320 L 990 440" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)" />
  <rect x="968" y="365" width="45" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="990" y="378" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">1 : N</text>

  <!-- auth_user to auth_user_groups: 1 to Many -->
  <path d="M 195 435 L 195 530" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)" />
  <rect x="172" y="470" width="45" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="195" y="483" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">1 : N</text>

  <!-- auth_group to auth_user_groups: 1 to Many -->
  <path d="M 450 620 L 330 620" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)" />
  <rect x="370" y="608" width="45" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="392" y="621" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">1 : N</text>

  <!-- auth_group to auth_group_permissions: 1 to Many -->
  <path d="M 720 620 L 860 620" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#crow)" />
  <rect x="770" y="608" width="45" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="792" y="621" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">1 : N</text>

  <!-- auth_permission to auth_group_permissions: 1 to Many -->
  <path d="M 990 580 L 990 530" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#crow)" marker-end="url(#one)" />

  <!-- Admin to Managed Models (Supervision / Dashboard Aggregation) -->
  <path d="M 195 720 L 195 800 L 450 800" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#crow)" />
  <rect x="250" y="788" width="130" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="315" y="802" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Supervises / Manages</text>


  <!-- ========================================================= -->
  <!-- TABLE ENTITIES                                            -->
  <!-- ========================================================= -->

  <!-- 1. ADMIN USER (auth_user where is_staff=True) -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="325" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#hdr-admin)" />
    <text x="135" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Admin User (auth_user)</text>
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="165" y="0" fill="#64748b">AutoField</text>

      <text x="32" y="24" font-weight="600" fill="#0f172a">username</text>
      <text x="165" y="24" fill="#64748b">CharField(150)</text>

      <text x="32" y="48" font-weight="600" fill="#0f172a">email</text>
      <text x="165" y="48" fill="#64748b">EmailField</text>

      <text x="32" y="72" font-weight="600" fill="#0f172a">password</text>
      <text x="165" y="72" fill="#64748b">CharField(128)</text>

      <text x="32" y="96" font-weight="700" fill="#dc2626">is_staff</text>
      <text x="165" y="96" font-weight="700" fill="#dc2626">True (Staff Access)</text>

      <text x="32" y="120" font-weight="700" fill="#dc2626">is_superuser</text>
      <text x="165" y="120" fill="#64748b">BooleanField</text>

      <text x="32" y="144" font-weight="600" fill="#0f172a">is_active</text>
      <text x="165" y="144" fill="#64748b">BooleanField</text>

      <text x="32" y="168" font-weight="600" fill="#0f172a">last_login</text>
      <text x="165" y="168" fill="#64748b">DateTimeField</text>

      <text x="32" y="192" font-weight="600" fill="#0f172a">date_joined</text>
      <text x="165" y="192" fill="#64748b">DateTimeField</text>
    </g>
    <!-- Special Badge -->
    <rect x="14" y="280" width="242" height="28" rx="4" fill="#fef2f2" stroke="#fecaca" />
    <text x="135" y="298" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Staff / Admin Security Clearance</text>
  </g>


  <!-- 2. django_admin_log (Action Audit Trail) -->
  <g transform="translate(460, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 38 L 0 38 Z" fill="url(#hdr-log)" />
    <text x="140" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">django_admin_log (Audit Trail)</text>
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="180" y="0" fill="#64748b">AutoField</text>

      <text x="0" y="24" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="24" font-weight="700" fill="#0f172a">user_id</text>
      <text x="180" y="24" fill="#64748b">FK(auth_user)</text>

      <text x="0" y="48" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="48" font-weight="700" fill="#0f172a">content_type_id</text>
      <text x="180" y="48" fill="#64748b">FK(ContentType)</text>

      <text x="32" y="72" font-weight="600" fill="#0f172a">object_id</text>
      <text x="180" y="72" fill="#64748b">TextField</text>

      <text x="32" y="96" font-weight="600" fill="#0f172a">object_repr</text>
      <text x="180" y="96" fill="#64748b">CharField(200)</text>

      <text x="32" y="120" font-weight="600" fill="#0f172a">action_flag</text>
      <text x="180" y="120" fill="#64748b">1=Add, 2=Mod, 3=Del</text>

      <text x="32" y="144" font-weight="600" fill="#0f172a">change_message</text>
      <text x="180" y="144" fill="#64748b">TextField</text>

      <text x="32" y="168" font-weight="600" fill="#0f172a">action_time</text>
      <text x="180" y="168" fill="#64748b">DateTimeField</text>
    </g>
  </g>


  <!-- 3. django_content_type -->
  <g transform="translate(870, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="175" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 252 0 Q 260 0 260 8 L 260 38 L 0 38 Z" fill="url(#hdr-content)" />
    <text x="130" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">django_content_type</text>
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="165" y="0" fill="#64748b">AutoField</text>

      <text x="32" y="24" font-weight="600" fill="#0f172a">app_label</text>
      <text x="165" y="24" fill="#64748b">CharField(100)</text>

      <text x="32" y="48" font-weight="600" fill="#0f172a">model</text>
      <text x="165" y="48" fill="#64748b">CharField(100)</text>
    </g>
    <rect x="14" y="130" width="232" height="24" rx="4" fill="#fffbeb" stroke="#fef3c7" />
    <text x="130" y="146" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">Maps models: meal, workout, profile</text>
  </g>


  <!-- 4. auth_permission -->
  <g transform="translate(870, 390)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 252 0 Q 260 0 260 8 L 260 38 L 0 38 Z" fill="url(#hdr-perm)" />
    <text x="130" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">auth_permission</text>
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="165" y="0" fill="#64748b">AutoField</text>

      <text x="0" y="24" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="24" font-weight="700" fill="#0f172a">content_type_id</text>
      <text x="165" y="24" fill="#64748b">FK(ContentType)</text>

      <text x="32" y="48" font-weight="600" fill="#0f172a">name</text>
      <text x="165" y="48" fill="#64748b">CharField(255)</text>

      <text x="32" y="72" font-weight="600" fill="#0f172a">codename</text>
      <text x="165" y="72" fill="#64748b">CharField(100)</text>
    </g>
    <rect x="14" y="150" width="232" height="24" rx="4" fill="#f0f9ff" stroke="#e0f2fe" />
    <text x="130" y="166" font-size="10" font-weight="600" fill="#0369a1" text-anchor="middle">e.g., add_meal, change_workout</text>
  </g>


  <!-- 5. auth_user_groups (Junction) -->
  <g transform="translate(60, 530)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#hdr-group)" />
    <text x="135" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">auth_user_groups (User Roles)</text>
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="165" y="0" fill="#64748b">AutoField</text>

      <text x="0" y="24" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="24" font-weight="700" fill="#0f172a">user_id</text>
      <text x="165" y="24" fill="#64748b">FK(auth_user)</text>

      <text x="0" y="48" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="48" font-weight="700" fill="#0f172a">group_id</text>
      <text x="165" y="48" fill="#64748b">FK(auth_group)</text>
    </g>
  </g>


  <!-- 6. auth_group -->
  <g transform="translate(450, 530)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#hdr-group)" />
    <text x="135" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">auth_group (Role Group)</text>
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="165" y="0" fill="#64748b">AutoField</text>

      <text x="32" y="24" font-weight="600" fill="#0f172a">name</text>
      <text x="165" y="24" fill="#64748b">CharField(150)</text>
    </g>
    <rect x="14" y="115" width="242" height="26" rx="4" fill="#f0fdf4" stroke="#dcfce7" />
    <text x="135" y="132" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Roles: Fitness Admin, Staff Coach</text>
  </g>


  <!-- 7. auth_group_permissions (Junction) -->
  <g transform="translate(860, 600)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#hdr-perm)" />
    <text x="135" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">auth_group_permissions</text>
    <g transform="translate(14, 58)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#2563eb">PK</text>
      <text x="32" y="0" font-weight="700" fill="#0f172a">id</text>
      <text x="165" y="0" fill="#64748b">AutoField</text>

      <text x="0" y="24" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="24" font-weight="700" fill="#0f172a">group_id</text>
      <text x="165" y="24" fill="#64748b">FK(auth_group)</text>

      <text x="0" y="48" font-weight="700" fill="#f59e0b">FK</text>
      <text x="32" y="48" font-weight="700" fill="#0f172a">permission_id</text>
      <text x="165" y="48" fill="#64748b">FK(Permission)</text>
    </g>
  </g>


  <!-- 8. MANAGED BUSINESS RESOURCES (Bottom Banner Card) -->
  <g transform="translate(450, 730)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="185" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 0 8 Q 0 0 8 0 L 372 0 Q 380 0 380 8 L 380 38 L 0 38 Z" fill="url(#hdr-managed)" />
    <text x="190" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Admin Managed Resources &amp; Aggregations</text>
    <g transform="translate(16, 52)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#1e293b">• accounts_userprofile:</text>
      <text x="145" y="0" fill="#64748b">Population BMI avg, Goal breakdown</text>

      <text x="0" y="24" font-weight="700" fill="#1e293b">• planner_meal &amp; items:</text>
      <text x="145" y="24" fill="#64748b">Global diet &amp; calorie master database</text>

      <text x="0" y="48" font-weight="700" fill="#1e293b">• planner_workout:</text>
      <text x="145" y="48" fill="#64748b">Master exercise &amp; duration templates</text>

      <text x="0" y="72" font-weight="700" fill="#1e293b">• planner_workoutschedule:</text>
      <text x="155" y="72" fill="#64748b">Weekly member completion audits</text>
    </g>
    <rect x="14" y="145" width="352" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="190" y="162" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Feed into: /admin-dashboard/ &amp; /admin/</text>
  </g>

</svg>
